name: Deploy to GitHub Pages

# Pages serves files and nothing else, which is the whole shape of this app: `next build` writes
# `out/`, the artifact is uploaded, Pages serves it. No runtime, no secrets, no server.
on:
  push:
    branches: [main, feat/host-on-pages] # ← the branch is here to deploy this PR before it lands
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push beats a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The project site lives at /Elvin; assets are emitted with this prefix.
          PAGES_BASE_PATH: /Elvin
      # Pages' branch mode runs Jekyll, which drops any directory starting with `_` — that is
      # `_next`. This file is what keeps a later switch to branch mode from breaking the site.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
